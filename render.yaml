# Blueprint do Render (plano FREE: sem disco persistente; anexos em /data/storage são perdidos a cada deploy/reinício;
# o PostgreSQL free expira após 30 dias):
# web service (Docker) + PostgreSQL gerenciado.
# Após o deploy, defina RG_ENCRYPTION_KEYS (python -m rg.cli gerar-chaves) e crie o admin no Shell:
#   python -m rg.cli criar-admin
services:
  - type: web
    name: setor-de-compras
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/saude
    envVars:
      - key: RG_AMBIENTE
        value: producao
      - key: RG_MODO_DEMO
        value: "false"
      - key: RG_SESSION_COOKIE_SECURE
        value: "true"
      - key: RG_TRUSTED_PROXIES
        value: "1"
      - key: RG_DB_POOL_MIN
        value: "1"
      - key: RG_DB_POOL_MAX
        value: "8"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RG_DATABASE_URL
        fromDatabase:
          name: compras-db
          property: connectionString
      - key: RG_SECRET_KEY
        generateValue: true
      - key: RG_SIGNATURE_SECRET
        generateValue: true
      - key: RG_ENCRYPTION_KEYS
        sync: false

databases:
  - name: compras-db
    plan: free
    databaseName: rg_hospital
    postgresMajorVersion: "16"
