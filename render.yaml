# Deploy no Render: um web service Python + um PostgreSQL (o disco do plano free não guarda arquivos).
# Para uso real: DEMO=0 e defina ADMIN_EMAIL / ADMIN_SENHA (administrador criado no primeiro boot).
services:
  - type: web
    name: setor-de-compras
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEMO
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: compras-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false

databases:
  - name: compras-db
    plan: free
