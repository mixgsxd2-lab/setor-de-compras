{% extends "base.html" %}
{% block titulo %}Fornecedores{% endblock %}
{% block conteudo %}
<h1>Fornecedores</h1>
<form method="post" class="cartao">
  <div class="linha">
    <label>Nome <input name="nome" required></label>
    <label>CNPJ <input name="cnpj"></label>
    <label>Telefone <input name="telefone"></label>
    <label>E-mail <input type="email" name="email"></label>
  </div>
  <div class="botoes"><button class="primario">Cadastrar</button></div>
</form>
<table>
  <thead><tr><th>Nome</th><th>CNPJ</th><th>Telefone</th><th>E-mail</th></tr></thead>
  <tbody>
  {% for f in lista %}
    <tr><td>{{ f.nome }}</td><td>{{ f.cnpj or '—' }}</td><td>{{ f.telefone or '—' }}</td><td>{{ f.email or '—' }}</td></tr>
  {% else %}
    <tr><td colspan="4" class="suave">Nenhum fornecedor cadastrado.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
